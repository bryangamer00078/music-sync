
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Music Sync</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px 16px 40px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 { margin: 12px 0 24px; }

button, input {
    padding: 12px 16px;
    border: 1px solid #444;
    border-radius: 10px;
    font-size: 16px;
}

button {
    background: #292929;
    color: white;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

input {
    width: 100%;
    margin: 6px 0 12px;
    background: #181818;
    color: white;
}

.panel {
    max-width: 650px;
    margin: 24px auto;
    padding: 18px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 16px;
}

.status {
    margin-top: 16px;
    color: #ccc;
    overflow-wrap: anywhere;
}

.meters {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 30px auto;
    max-width: 420px;
}

.meter { flex: 1; min-width: 0; }

.bar {
    height: 200px;
    background: #222;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
}

.fill {
    width: 100%;
    height: 0%;
    transition: height .05s linear;
}

#bass { background: #ff1744; }
#mid { background: #ff9100; }
#treble { background: #00e676; }

.label { margin-top: 10px; font-size: 15px; }
.value { margin-top: 5px; color: #aaa; }

.field {
    text-align: left;
    margin: 14px 0;
}

#lamp-list {
    text-align: left;
    overflow-wrap: anywhere;
}

.lamp {
    padding: 10px;
    margin: 8px 0;
    background: #242424;
    border-radius: 8px;
}

.small {
    font-size: 13px;
    color: #aaa;
    line-height: 1.5;
}

@media (max-width: 380px) {
    .meters { gap: 10px; }
    .bar { height: 160px; }
    .label { font-size: 13px; }
}
</style>
</head>

<body>

<h1>🎵 MUSIC SYNC</h1>

<button id="start">🎤 Microfoon starten</button>
<div id="status" class="status">Microfoon uit</div>

<div class="meters">
    <div class="meter">
        <div class="bar"><div id="bass" class="fill"></div></div>
        <div class="label">BASS</div>
        <div id="bassValue" class="value">0%</div>
    </div>

    <div class="meter">
        <div class="bar"><div id="mid" class="fill"></div></div>
        <div class="label">MIDS</div>
        <div id="midValue" class="value">0%</div>
    </div>

    <div class="meter">
        <div class="bar"><div id="treble" class="fill"></div></div>
        <div class="label">TREBLE</div>
        <div id="trebleValue" class="value">0%</div>
    </div>
</div>

<section class="panel">
    <h2>🔌 Home Assistant</h2>

    <p class="small">
        Verbind met Home Assistant om je lampenlijst op te halen.
        Je toegangstoken wordt alleen in het geheugen van deze pagina
        gebruikt en niet opgeslagen.
    </p>

    <div class="field">
        <label for="ha-url">Home Assistant URL</label>
        <input id="ha-url" type="url"
               value="http://100.125.53.71"
               placeholder="https://jouw-home-assistant-adres">
    </div>

    <div class="field">
        <label for="ha-token">Long-Lived Access Token</label>
        <input id="ha-token" type="password"
               autocomplete="off"
               placeholder="Plak je token hier">
    </div>

    <button id="ha-connect">Verbinden en lampen ophalen</button>
    <div id="ha-status" class="status">Nog niet verbonden</div>
    <div id="lamp-list"></div>
</section>

<script>
"use strict";

/* ---------------- AUDIO ---------------- */

let audioContext = null;
let analyser = null;
let microphone = null;
let audioStream = null;
let dataArray = null;
let animationFrame = null;

const $ = id => document.getElementById(id);

$("start").addEventListener("click", async () => {
    $("start").disabled = true;

    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error(
                "Microfoon niet beschikbaar. Open de pagina via HTTPS."
            );
        }

        audioStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            }
        });

        audioContext = new AudioContext();
        await audioContext.resume();

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0.65;

        microphone = audioContext.createMediaStreamSource(audioStream);
        microphone.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        $("status").textContent = "🟢 Microfoon actief";
        analyse();

    } catch (error) {
        $("status").textContent = "❌ " + error.message;
        $("start").disabled = false;
    }
});

function analyse() {
    if (!analyser || !audioContext || !dataArray) return;

    analyser.getByteFrequencyData(dataArray);

    let bass = 0, mid = 0, treble = 0;
    let bassCount = 0, midCount = 0, trebleCount = 0;

    for (let i = 0; i < dataArray.length; i++) {
        const frequency =
            i * audioContext.sampleRate / analyser.fftSize;
        const value = dataArray[i] / 255;

        if (frequency >= 30 && frequency < 160) {
            bass += value;
            bassCount++;
        } else if (frequency >= 160 && frequency < 2000) {
            mid += value;
            midCount++;
        } else if (frequency >= 2000 && frequency < 12000) {
            treble += value;
            trebleCount++;
        }
    }

    bass = Math.min(100, (bassCount ? bass / bassCount : 0) * 180);
    mid = Math.min(100, (midCount ? mid / midCount : 0) * 180);
    treble = Math.min(100, (trebleCount ? treble / trebleCount : 0) * 180);

    $("bass").style.height = bass + "%";
    $("mid").style.height = mid + "%";
    $("treble").style.height = treble + "%";

    $("bassValue").textContent = Math.round(bass) + "%";
    $("midValue").textContent = Math.round(mid) + "%";
    $("trebleValue").textContent = Math.round(treble) + "%";

    animationFrame = requestAnimationFrame(analyse);
}

/* ---------------- HOME ASSISTANT ---------------- */

const knownLights = [
    "light.bed_en_piano",
    "light.floor_lamp_3",
    "light.floor_lamp_4",
    "light.floor_lamp_5",
    "light.hdmi_sync_box_2",
    "light.lsc_party_string_light",
    "light.smart_panel_lights",
    "light.smart_panel_lights_2"
];

let haToken = "";

function setHaStatus(message) {
    $("ha-status").textContent = message;
}

$("ha-connect").addEventListener("click", async () => {
    const rawUrl = $("ha-url").value.trim().replace(/\/+$/, "");
    const token = $("ha-token").value.trim();

    $("lamp-list").replaceChildren();

    if (!rawUrl || !token) {
        setHaStatus("Vul zowel de Home Assistant-URL als het token in.");
        return;
    }

    let parsedUrl;

    try {
        parsedUrl = new URL(rawUrl);
    } catch {
        setHaStatus("De URL is ongeldig.");
        return;
    }

    if (!["http:", "https:"].includes(parsedUrl.protocol)) {
        setHaStatus("Gebruik een HTTP- of HTTPS-adres.");
        return;
    }

    if (location.protocol === "https:" && parsedUrl.protocol === "http:") {
        setHaStatus(
            "⚠️ Deze pagina gebruikt HTTPS, maar Home Assistant HTTP. " +
            "De browser kan dit blokkeren. Hiervoor is een HTTPS-adres nodig."
        );
        return;
    }

    $("ha-connect").disabled = true;
    setHaStatus("Verbinding testen...");

    try {
        const response = await fetch(rawUrl + "/api/", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }
        });

        if (!response.ok) {
            if (response.status === 401) {
                throw new Error(
                    "HTTP 401: controleer of je token correct is."
                );
            }
            throw new Error("Home Assistant antwoordde met HTTP " + response.status);
        }

        const result = await fetch(rawUrl + "/api/states", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }
        });

        if (!result.ok) {
            throw new Error("Lampen ophalen mislukt: HTTP " + result.status);
        }

        const states = await result.json();
        const lights = states.filter(item =>
            item.entity_id.startsWith("light.")
        );

        haToken = token;
        $("ha-token").value = "";

        setHaStatus(
            "✅ Verbonden! " + lights.length +
            " lamp-entiteiten gevonden."
        );

        const list = $("lamp-list");

        for (const entityId of knownLights) {
            const light = lights.find(item => item.entity_id === entityId);
            const row = document.createElement("div");
            row.className = "lamp";
            row.textContent = light
                ? "💡 " + (light.attributes.friendly_name || entityId)
                  + " — " + light.state
                : "⚠️ Niet gevonden: " + entityId;
            list.appendChild(row);
        }

    } catch (error) {
        haToken = "";
        setHaStatus(
            "❌ " + error.message +
            " Controleer je HTTPS-adres, Tailscale en token."
        );
    } finally {
        $("ha-connect").disabled = false;
    }
});

/*
 * Deze versie test de verbinding en haalt lampen op.
 * Hij schakelt lampen nog niet automatisch op muziek aan.
 * Eerst moet de verbinding betrouwbaar werken.
 */
</script>

</body>
</html>
